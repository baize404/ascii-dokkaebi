<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d16" />
    <title>斷橋與燈｜ASCII Dokkaebi 玩法原型（Gate 1）</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/proto/proto.css" />
  </head>
  <body>
    <canvas id="game" aria-label="遊戲畫面"></canvas>
    <div id="hud">
      <div id="lamp-status" aria-label="燈籠狀態">
        <span class="flame" aria-hidden="true"></span>
        <span class="bar"><i id="flame-bar"></i></span>
        <span class="spirit-flag">靈視</span>
        <span class="wind-flag">風</span>
      </div>
      <div class="top-buttons">
        <button id="btn-view" type="button" title="切換鏡頭（V）">近景</button>
        <button id="btn-help" type="button" title="操作說明">?</button>
      </div>
      <div id="tip" role="status" hidden></div>
      <div id="caption" role="status" hidden></div>
      <button id="prompt" type="button" hidden></button>
      <div id="action-buttons">
        <button id="btn-raise" type="button" title="按住舉高燈籠（F）">舉燈</button>
        <button id="btn-spirit" type="button" title="切換靈視（Q）">靈視</button>
      </div>
      <div id="joystick" class="joystick" hidden aria-hidden="true"><div class="knob"></div></div>
    </div>
    <div id="fade"></div>
    <section id="intro" class="sheet">
      <h1>斷橋與燈</h1>
      <p class="sub">ASCII Dokkaebi 玩法原型（Gate 1）</p>
      <p>這是一段灰盒測試關卡，用來確認「月魂燈籠、靈界、風」這組規則好不好玩。外觀還很簡單，請專心在玩法上。</p>
      <p>目標：到峽谷對面，點亮祠堂的石燈。</p>
      <table class="keys">
        <tr><th>移動</th><td>WASD／方向鍵，或點地面</td><td>搖桿，或點地面</td></tr>
        <tr><th>互動</th><td>E</td><td>「互動」按鈕</td></tr>
        <tr><th>舉起燈籠</th><td>按住 F</td><td>按住「舉燈」</td></tr>
        <tr><th>靈視</th><td>Q</td><td>「靈視」</td></tr>
        <tr><th>鏡頭</th><td>V 遠景／近景、T ASCII／3D</td><td>右上角</td></tr>
      </table>
      <button id="btn-start" type="button">開始</button>
      <p class="muted"><a href="./">回到正式版遊戲</a></p>
    </section>
    <section id="end" class="sheet" hidden>
      <h1>石燈亮了</h1>
      <p>原型到這裡結束。謝謝試玩！如果你是測試觀察員，請把下面的數字抄進觀察表。</p>
      <table id="end-stats"></table>
      <button id="btn-again" type="button">再玩一次</button>
      <p class="muted"><a href="./">回到正式版遊戲</a></p>
    </section>
    <script type="module" src="/src/proto/main.js"></script>
  </body>
</html>
