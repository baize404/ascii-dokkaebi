<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d16" />
    <title>달 도둑 도깨비 · ASCII Dokkaebi</title>
    <meta name="description" content="韓國民間傳說 × ASCII 藝術的 3D 探索解謎網頁遊戲：在沒有月亮的夜晚，找回被도깨비偷走的月亮。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // 主程式載入失敗（例如網站還在部署、網路中斷）時，顯示說明而不是一頁沒有樣式的文字
      window.addEventListener(
        'error',
        function (e) {
          if (e.target && e.target.tagName === 'SCRIPT') {
            var box = document.getElementById('boot-error');
            if (box) {
              box.hidden = false;
              box.style.display = 'flex';
            }
          }
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="view" aria-label="遊戲畫面"></canvas>

      <!-- 遊戲中 HUD -->
      <div id="hud" class="hud" hidden>
        <button id="objective" class="objective" type="button" aria-label="目前目標，點一下打開任務日誌">
          <span class="chapter" id="objective-chapter"></span>
          <span class="text" id="objective-text"></span>
        </button>
        <div class="hud-buttons">
          <button id="btn-hint" type="button" title="提示（不會直接說出答案）">提示</button>
          <button id="btn-inventory" type="button" title="背包（I）">背包<span class="badge" id="inventory-badge" hidden></span></button>
          <button id="btn-map" type="button" title="地圖（M）">地圖</button>
          <button id="btn-view" type="button" title="切換鏡頭：遠景／近景（V）">近景</button>
          <button id="btn-menu" type="button" title="選單（Esc）" aria-label="選單">☰</button>
        </div>
        <canvas id="minimap" class="minimap" width="140" height="150" aria-label="小地圖，點一下放大"></canvas>
        <div id="tip" class="tip" role="status" hidden></div>
        <button id="prompt" class="prompt" type="button" hidden></button>
        <div id="joystick" class="joystick" hidden aria-hidden="true"><div class="knob"></div></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <div id="fps" class="fps" hidden></div>
      </div>

      <!-- 過場：上下黑邊＋字幕 -->
      <div id="letterbox" class="letterbox" hidden>
        <div class="bar top"></div>
        <div class="bar bottom">
          <p id="caption" class="caption"></p>
          <button id="btn-skip" type="button" class="skip">跳過 ▸▸</button>
        </div>
      </div>

      <!-- 對話框 -->
      <div id="dialogue" class="dialogue-layer" hidden>
        <div class="dialogue" role="dialog" aria-live="polite">
          <div class="body">
            <div class="speaker" id="dialogue-speaker"></div>
            <p class="text" id="dialogue-text"></p>
            <div class="choices" id="dialogue-choices"></div>
            <div class="dialogue-bar">
              <button id="btn-history" type="button">歷史</button>
              <span class="hint" id="dialogue-hint">點一下繼續 ▸</span>
            </div>
          </div>
        </div>
      </div>
      <div id="glossary-pop" class="glossary-pop" role="tooltip" hidden></div>

      <!-- 標題畫面（主選單） -->
      <section id="screen-title" class="screen title-screen">
        <div class="title-inner">
          <h1 class="game-title" lang="ko">도깨비</h1>
          <p class="subtitle">달 도둑 도깨비<span>偷走月亮的鬼怪</span></p>
          <nav class="menu" aria-label="主選單">
            <button id="btn-continue" type="button" hidden>繼續旅程<small id="continue-info"></small></button>
            <button id="btn-new" type="button" class="primary">新的旅程</button>
            <button id="btn-settings-title" type="button">設定</button>
            <button id="btn-help-title" type="button">操作說明</button>
            <button id="btn-codex-title" type="button">民俗圖鑑</button>
            <button id="btn-achievements-title" type="button">成就</button>
          </nav>
          <p class="credit">韓國民間傳說 × ASCII 藝術 × 3D 探索 · 原創作品</p>
        </div>
      </section>

      <!-- 通用面板：日誌、背包、地圖、設定、說明、圖鑑、成就、暫停、對話歷史 -->
      <section id="panel" class="panel-layer" hidden>
        <div class="panel-box" role="dialog" aria-modal="true" aria-labelledby="panel-title">
          <header>
            <h2 id="panel-title"></h2>
            <nav id="panel-tabs" class="tabs"></nav>
            <button id="panel-close" type="button" class="close" aria-label="關閉">✕</button>
          </header>
          <div id="panel-body" class="panel-body"></div>
        </div>
      </section>

      <!-- 結局 -->
      <section id="screen-end" class="screen" hidden>
        <div class="end-inner">
          <pre class="ascii-moon" aria-hidden="true">
      .-""""-.
    .'        '.
   /    .--.    \
  |    (    )    |
   \    '--'    /
    '.        .'
      '-....-'</pre>
          <p class="ending-label" id="end-label"></p>
          <h2 id="end-title"></h2>
          <p id="end-text"></p>
          <dl class="stats" id="end-stats"></dl>
          <ul class="new-achievements" id="end-achievements"></ul>
          <div class="actions">
            <button id="btn-restart" type="button" class="primary">↻ 再玩一次</button>
            <button id="btn-to-title" type="button">回到標題</button>
          </div>
        </div>
      </section>

      <!-- 載入失敗時的說明（不依賴外部 CSS，才能在樣式也載不到時正常顯示） -->
      <div
        id="boot-error"
        hidden
        style="position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; padding: 24px; background: #080d16; color: #e2e8ef; font-family: monospace; text-align: center; line-height: 1.8"
      >
        <div>
          <p style="color: #f2bd68; font-size: 1.15rem; margin: 0 0 0.6em">遊戲載入失敗</p>
          <p id="boot-error-detail" style="margin: 0">遊戲程式沒有成功載入。請重新整理頁面；如果還是不行，網站可能正在更新，請稍後再試。</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
